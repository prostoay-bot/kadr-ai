name: Restore local PDF.js worker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-pdfjs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch matching PDF.js worker
        run: |
          mkdir -p vendor/pdfjs
          curl --fail --location --retry 3 -o vendor/pdfjs/pdf.worker.mjs https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.worker.mjs
          test -s vendor/pdfjs/pdf.worker.mjs
      - name: Commit worker
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/pdfjs/pdf.worker.mjs
          git diff --cached --quiet || (git commit -m "Include local PDF.js worker" && git push)
