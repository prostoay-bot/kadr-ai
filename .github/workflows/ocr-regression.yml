name: OCR safety regression tests
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/ocr-quality.test.cjs
      - .github/workflows/ocr-regression.yml
  pull_request:
    paths:
      - index.html
      - tests/ocr-quality.test.cjs
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ocr-quality.test.cjs
