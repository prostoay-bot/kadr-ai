name: Release safety checks
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/release-safety.test.cjs
      - .github/workflows/release-safety.yml
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/release-safety.test.cjs tests/ocr-quality.test.cjs
