cal}.field input:focus,.field textarea:focus,.field select:focus{border-color:#94b83e}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.notice{background:#fff3d7;padding:15px 17px;border-radius:14px;color:#72551e;line-height:1.6;font-size:13px;margin:17px 0}.muted{color:var(--muted)}.empty{text-align:center;padding:32px;color:var(--muted);font-size:13px}.dialogback{position:fixed;inset:0;background:#1b2415a6;display:grid;place-items:center;padding:15px;z-index:30}.dialog{background:white;width:100%;max-width:520px;padding:25px;border-radius:20px;max-height:92vh;overflow:auto}.dialog h3{margin:0 0 22px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:1px solid var(--line);border-radius:8px;min-height:79px;padding:6px;font-size:12px;background:white}.day.other{opacity:.25}.day.today{border:2px solid #9abf34}.dots{color:#65842b;font-size:11px;margin-top:6px;line-height:1.4}.pre{white-space:pre-wrap;word-break:break-word}.fileinput{padding:22px;background:#f6f9ee;border:1px dashed #b9c6a1;border-radius:14px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:850px){.side{width:73px;padding:15px 8px}.brand{padding:8px 4px 20px}.brand span,.nav span:last-child,.sidefoot{display:none}.nav{justify-content:center;padding:12px 5px}.main{padding:25px 17px}.hero .mascot{display:none}.two{grid-template-columns:1fr}}@media(max-width:520px){.cards3{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{padding:12px}.count{font-size:27px}.label{font-size:11px}.pageTitle{font-size:27px}.hero{padding:22px}.hero h2{font-size:21px}.day{min-height:51px;padding:3px;font-size:10px}.dots{font-size:9px}}

'use strict';let KEY='hr-assistant-demo-v1';const now=new Date(),iso=d=>{let t=new Date(d);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')},shift=n=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)},today=iso(now),uid=()=>Math.random().toString(36).slice(2,11),escapeHtml=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let demo={company:'ООО «Пример»',orgs:['ООО «Пример»'],tasks:[{id:'demo1',title:'Проверить окончание испытательного срока',due:shift(2),description:'Демонстрационная задача',done:false,origin:null},{id:'demo2',title:'Проверить кадровую отчётность',due:shift(5),description:'Демонстрационная задача',done:false,origin:null}],audits:[{id:'example',name:'Пример проверки трудового договора',created:today,notes:[{id:'note1',title:'Демонстрационное замечание: условие о месте работы',severity:'medium',detail:'Пример того, как будет выглядеть замечание. Это не результат правового анализа документа.',solution:'В реальной версии проверить документ и соответствующие нормы.',done:false}]}]},load=()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tasks)&&Array.isArray(x.audits))return x}catch(e){}return structuredClone(demo)};let db=load();db.orgs=db.orgs||[db.company];db.lawDocs=Array.isArray(db.lawDocs)?db.lawDocs:[];db.tasks.forEach(t=>t.company??=db.company);db.audits.forEach(a=>a.company??=db.company);let filter='active',view='home',calendarMode=false,month=new Date(now.getFullYear(),now.getMonth(),1);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function iconFace(){return '<div class="mascot" aria-label="Фирменный помощник"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div>'}const tabs=[['home','⌂','Главная'],['audit','▤','Кадровый аудитор'],['radar','▦','Кадровый радар'],['law','⚖','Центр законодательства'],['settings','⚙','Настройки']];const companyTasks=()=>db.tasks.filter(t=>t.company===db.company),companyAudits=()=>db.audits.filter(a=>a.company===db.company),allNotes=()=>companyAudits().flatMap(a=>a.notes.map(n=>({...n,auditId:a.id,auditName:a.name}))),openTasks=()=>companyTasks().filter(t=>!t.done),rem=()=>openTasks().filter(t=>t.due<=shift(3)).length;function nav(v){view=v;render()}function render(){let titles={home:'Рабочий стол',audit:'Кадровый аудитор',radar:'Кадровый радар',law:'Центр законодательства',settings:'Организация и настройки'},desc={home:'Всё важное — в одном месте.',audit:'Документы, замечания и задачи по исправлению.',radar:'Контролируйте кадровые задачи и сроки.',law:'Встроенный справочник и поиск по загруженным правовым актам.',settings:'Данные организации и настройки демоверсии.'};document.getElementById('root').innerHTML='<div class="app"><aside class="side"><div class="brand">'+iconFace()+'<span>Кадровый<br>помощник</span></div><nav>'+tabs.map(([id,ic,t])=>`<button class="nav ${view===id?'active':''}" onclick="nav('${id}')"><span class="ico">${ic}</span><span>${t}</span></button>`).join('')+'</nav><div class="sidefoot">Локальная демоверсия. Хранение только в этом браузере. Не загружайте документы с персональными данными.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">'+escapeHtml(db.company)+'</div><h1 class="pageTitle">'+titles[view]+'</h1><p class="sub">'+desc[view]+'</p></div><span class="pill">Бесплатная локальная версия</span></div>'+({home:home,audit:audit,radar:radar,law:law,settings:settings}[view]())+ (openTasks().some(t=>t.due<today)?'<div role="status" class="notice"><b>Внимание:</b> есть просроченные задачи. Проверьте «Кадровый радар».</div>':'')+'</main></div>'}
function taskHtml(t){let overdue=!t.done&&t.due<today;return `<div class="entry"><div class="entryhead"><div><h4>${t.done?'✓ ':''}${escapeHtml(t.title)}</h4><p>Срок: ${escapeHtml(t.due)} ${overdue?'· Просрочено':''} ${t.origin?'· Из замечания аудитора':''}</p>${t.description?'<p>'+escapeHtml(t.description)+'</p>':''}</div><span class="tag ${overdue?'high':t.done?'low':'medium'}">${t.done?'Выполнена':overdue?'Просрочена':'В работе'}</span></div><div class="actions"><button class="btn sm secondary" onclick="toggleTask('${t.id}')">${t.done?'Вернуть в работу':'✓ Выполнить'}</button><button class="btn sm secondary" onclick="editTask('${t.id}')">Изменить</button>${t.origin?`<button class="btn sm secondary" onclick="goNote('${t.origin.auditId}')">К замечанию</button>`:''}<button class="btn sm warn" onclick="deleteTask('${t.id}')">Удалить</button></div></div>`}
function home(){let tasks=openTasks().slice().sort((a,b)=>a.due.localeCompare(b.due));let notes=allNotes().filter(n=>!n.done);return `<div class="hero"><div><h2>Пусть кадровые сроки<br>будут под контролем!</h2><p>Здесь собраны ближайшие события и замечания. Начнём с самого важного.</p><button class="btn" onclick="newTask()">+ Добавить задачу</button></div>${iconFace()}</div><div class="cards3"><div class="card"><div class="count">${rem()}</div><div class="label">Срочно и в ближайшие 3 дня</div></div><div class="card"><div class="count">${notes.length}</div><div class="label">Открытых замечаний</div></div><div class="card"><div class="count">${tasks.length}</div><div class="label">Активных задач</div></div></div><div class="two"><section><div class="sect"><h3>Ближайшие задачи</h3><button class="btn sm secondary" onclick="nav('radar')">Все →</button></div>${tasks.length?tasks.slice(0,4).map(taskHtml).join(''):'<div class="entry empty">Задач нет. Отличный повод запланировать следующую.</div>'}</section><section><div class="sect"><h3>Замечания аудитора</h3><button class="btn sm secondary" onclick="nav('audit')">Открыть →</button></div>${notes.length?notes.slice(0,4).map(n=>noteHtml(n)).join(''):'<div class="entry empty">Открытых замечаний нет.</div>'}</section></div>`}
function noteHtml(n){let link=db.tasks.some(t=>t.origin&&t.origin.noteId===n.id&&!t.done);return `<div class="entry"><div class="entryhead"><div><h4>${escapeHtml(n.title)}</h4><p>${escapeHtml(n.detail)}</p><p><b>Действие:</b> ${escapeHtml(n.solution)}</p></div><span class="tag ${n.severity==='high'?'high':n.severity==='low'?'low':'medium'}">${n.severity==='high'?'Высокий':n.severity==='low'?'Низкий':'Средний'}</span></div><div class="actions"><button class="btn sm" onclick="taskFromNote('${n.auditId}','${n.id}')" ${link?'disabled':''}>${link?'Задача создана':'+ В радар'}</button><button class="btn sm secondary" onclick="editFinding('${n.auditId}','${n.id}')">Изменить</button><button class="btn sm warn" onclick="deleteFinding('${n.auditId}','${n.id}')">Удалить</button><button class="btn sm secondary" onclick="toggleNote('${n.auditId}','${n.id}')">${n.done?'Вернуть замечание':'Отметить исправленным'}</button></div></div>`}
function audit(){return `${(!tkCorpus||!tkCorpus.sourceVerified||!tkCorpus.editionVerified)?'<div class="notice" role="alert"><b>Локальный текст закона не подтверждён:</b> все выводы аудита требуют ручной проверки по действующей на дату события норме. <a href="https://pravo.gov.ru/" target="_blank" rel="noopener noreferrer">Проверить официальный источник ↗</a></div>':''}<div class="notice"><b>Ограниченный режим проверки.</b> Доступна ограниченная локальная автоматическая проверка по заранее заданным правовым правилам. Она не является полной юридической экспертизой. Не загружайте реальные документы сотрудников или персональные данные.</div><div class="toolbar"><button class="btn" onclick="newAudit()">+ Новая проверка</button><button class="btn secondary" onclick="addDemoAudit()">Добавить пример</button><button class="btn secondary" onclick="downloadReport()">↓ Скачать реестр замечаний</button></div><div class="sect"><h3>Проверки (${companyAudits().length})</h3></div>${companyAudits().length?companyAudits().map(a=>`<div class="card" id="audit-${a.id}" style="margin-bottom:14px"><div class="entryhead"><div><h3 style="margin:0 0 8px;font-size:17px">${escapeHtml(a.name)}</h3><p class="sub">Создано: ${escapeHtml(a.created)} · Замечаний: ${a.notes.length} · Исправлено: ${a.notes.filter(n=>n.done).length}</p></div><div class="actions"><button class="btn sm secondary" onclick="newFinding('${a.id}')">+ Замечание</button><button class="btn sm warn" onclick="deleteAudit('${a.id}')">Удалить</button></div></div>${a.notes.map(n=>noteHtml({...n,auditId:a.id})).join('')||'<div class="empty">Замечаний нет.</div>'}</div>`).join(''):'<div class="entry empty">Проверок пока нет. Создайте демонстрационный пример.</div>'}<div class="sect"><h3>Проверка трудового договора</h3></div><div class="card"><p class="sub">Загрузите PDF, Word или фотографию ниже. Приложение извлечёт текст и выполнит локальную проверку по набору правил ТК РФ для трудового договора или дополнительного соглашения (выберите тип документа). Это предварительная проверка, а не юридическое заключение.</p><label class="field">Тип документа<select id="docType" aria-label="Тип документа"><optgroup label="Договоры"><option value="contract">Трудовой договор</option><option value="addendum">Дополнительное соглашение</option></optgroup><optgroup label="Приказы"><option value="o_hire">Приказ о приёме</option><option value="o_transfer">Приказ о переводе</option><option value="o_dismiss">Приказ об увольнении</option><option value="o_vac">Приказ об отпуске</option></optgroup><optgroup label="ЛНА"><option value="l_pvtr">Правила внутреннего трудового распорядка</option><option value="l_pay">Положение об оплате труда</option><option value="l_pd">Положение о персональных данных</option></optgroup></select></label><label class="field">Дата кадрового события (приём, перевод, увольнение, начало отпуска)<input type="date" id="eventDate"></label><details class="entry"><summary>Сведения о работнике (необязательно, нужны для исключений)</summary><p class="sub">Без них приложение не определяет особые категории и выдаёт «Требуется уточнение».</p><p><label><input type="checkbox" id="wp_known"> Сведения заполнены (иначе категории считаются неизвестными)</label></p><p><label><input type="checkbox" id="wp_mgr"> Руководитель организации, заместитель, главный бухгалтер или руководитель филиала</label></p><p><label><input type="checkbox" id="wp_minor"> Младше 18 лет</label></p><p><label><input type="checkbox" id="wp_preg"> Беременная</label></p><p><label><input type="checkbox" id="wp_ch3"> Женщина, имеющая ребёнка в возрасте до 3 лет</label></p><p><label><input type="checkbox" id="wp_dis"> Инвалид</label></p><p><label><input type="checkbox" id="wp_pt"> Совместитель</label></p><p><label><input type="checkbox" id="wp_pens"> Пенсионер по возрасту</label></p></details><div class="actions"><button class="btn" onclick="trySampleContract()">▶ Проверить образец договора</button><button class="btn secondary" onclick="toggleContractInput()">Вставить текст вручную (необязательно)</button></div><div id="contractInput" style="display:none;margin-top:18px"><label class="field">Распознанный или вставленный текст договора<textarea id="contractText" style="height:190px" placeholder="Вставьте обезличенный текст договора, без ФИО, паспортных данных, адресов и иных персональных данных"></textarea></label><button class="btn" onclick="checkContractText()">Проверить текст</button> <button class="btn secondary" onclick="wipeContract()">🗑 Очистить</button></div><div id="contractResults"></div></div><div class="sect"><h3>Загрузить свой трудовой договор</h3></div><div class="fileinput" id="dropZone" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event)"><div class="upload-graphic">⇧</div><h3 style="margin:0 0 6px">Перетащите договор сюда</h3><p class="sub" style="margin:3px 0 15px">или выберите файл с компьютера или телефона</p><button type="button" class="btn" onclick="document.getElementById('contractFile').click()">Выбрать документ</button><input type="file" id="contractFile" accept=".pdf,.docx,.txt,.jpg,.jpeg,.png,.webp,.bmp,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*,text/plain" onchange="processContractFile(this.files?.[0])" class="visually-hidden"><p class="sub" style="margin:16px 0 0">PDF · Word DOCX · JPG · PNG · WebP · BMP · TXT</p><p class="sub">Для фото и сканов: распознавание текста (OCR). До 10 МБ, PDF — максимум 20 страниц, OCR — до 5 страниц.</p></div><details class="entry" style="margin-top:12px"><summary>У меня старый Word (.doc) — как загрузить?</summary><p class="sub">Формат .doc пока не поддерживается. Откройте документ в Word или LibreOffice и выберите «Сохранить как → DOCX» либо «Экспортировать → PDF». Для проверки можно также вставить обезличенный текст вручную. Не используйте онлайн-конвертеры для кадровых документов с персональными данными.< function localContractReview(s){
 let checks=[],push=(c)=>checks.push({...c,id:checks.length});
 const fields=[
 ['Место работы',/место\s+работы|принимается\s+на\s+работу\s+в|местонахождение\s+работ/i,'Уточнить место работы, при необходимости подразделение и его местонахождение.'],
 ['Трудовая функция',/должност[ьи]|професси[ия]|трудовая\s+функция|принимается\s+на\s+работу\s+в\s+качестве/i,'Сопоставить функцию со штатным расписанием и фактической работой.'],
 ['Дата начала работы',/дата\s+начала|приступ[а-я]+\s+к\s+работе|начал[оа]\s+работ[ыа]/i,'Проверить точную дату начала работы.'],
 ['Условия оплаты труда',/оклад|тарифн[а-я]+\s+ставк|заработн[а-я]+\s+плат|должностн[а-я]+\s+оклад/i,'Проверить размер и состав оплаты, а также применимые доплаты.'],
 ['Условия труда на рабочем месте',/условия\s+труда\s+на\s+рабочем\s+месте|класс\s+условий\s+труда|результат[а-я]*\s+соут/i,'Сверить указанные условия с результатами СОУТ; общего упоминания процедуры может быть недостаточно.'],
 ['Обязательное социальное страхование',/обязательн[а-я]+\s+социальн[а-я]+\s+страхован|социальному\s+страхованию/i,'Проверить наличие условия об обязательном социальном страховании.'],
 ];
 for(const [title,pattern,hint] of fields){let m=pattern.exec(s);push({title,found:!!m,severity:m?'low':'medium',kind:m?'identified':'missing',excerpt:contractExcerpt(s,m),hint:m?'Признак обнаружен. '+hint:'Условие не обнаружено автоматическим поиском. '+hint+' Оно может быть выражено иначе или включено в связанный документ.',article:'57'});}
 let m;
 // Check suspicious termination-notice clauses, not generic 1-month mentions.
 m=/(?:увольнен[ияи]|расторжен[ияи]\s+трудов[а-я]+\s+договор[а-я]*|по\s+собственному\s+желанию)[\s\S]{0,125}?(?:предупредить|предупрежд[а-я]*|уведомить)[\s\S]{0,90}?(?:за\s+(?:один|1)\s+месяц|за\s+30\s+(?:календарных\s+)?дн)/i.exec(s)||/(?:предупредить|уведомить)[\s\S]{0,100}?(?:об\s+увольнении|о\s+расторжении)[\s\S]{0,100}?(?:за\s+(?:один|1)\s+месяц|за\s+30\s+(?:календарных\s+)?дн)/i.exec(s);
 if(m)push({title:'Возможное увеличение срока предупреждения об увольнении',found:true,severity:'high',kind:'risk',excerpt:contractExcerpt(s,m),article:'80',hint:'Для обычного увольнения по собственному желанию общий срок предупреждения — не позднее чем за две недели; возможны специальные сроки по закону. Уточнить должность и основание увольнения, проверить формулировку.'});
 m=/(?:ежегодн[а-я]*\s+(?:основн[а-я]*\s+)?оплачиваем[а-я]*\s+отпуск|продолжительност[ьи]\s+отпуска)[\s\S]{0,100}?(\d{1,2})\s+календарн[а-я]*\s+дн/i.exec(s);
 if(m&&+m[1]<28)push({title:'Продолжительность основного отпуска меньше 28 дней',found:true,severity:'high',kind:'risk',excerpt:contractExcerpt(s,m),article:'115',hint:'По общему правилу ежегодный основной оплачиваемый отпуск составляет 28 календарных дней. Проверить, не ошибочно ли указан меньший срок и какие нормы применимы к конкретному работнику.'});
 m=/(?:испытательн[а-я]*\s+(?:срок|период)|срок\s+испытания)[\s\S]{0,70}?(\d+)\s+месяц/i.exec(s);
 if(m&&+m[1]>3)push({title:'Испытание свыше трёх месяцев',found:true,severity:'medium',kind:'risk',excerpt:contractExcerpt(s,m),article:'70',hint:'Для большинства работников испытание не может превышать три месяца. Для отдельных руководителей и иных предусмотренных законом случаев действуют исключения. Проверить категорию работника и редакцию нормы на дату договора.'});
 m=/(?:срочн[а-я]*\s+трудов[а-я]*\s+договор|договор\s+заключ[а-я]*\s+на\s+срок\s+до)/i.exec(s);
 if(m)push({title:'Основание срочного трудового договора',found:true,severity:'medium',kind:'context',excerpt:contractExcerpt(s,m),article:'57',hint:'Проверить наличие срока и законного обстоятельства, позволяющего заключить срочный договор; требуется также оценка по ст. 58–59 ТК РФ.'});
 return checks;
}

 out+='<div class="sect"><h3>Предварительные результаты</h3><span class="sub">Обнаружено условий: '+identified+' · Формулировок с риском: '+risks+' · Всего контрольных пунктов: '+currentContractChecks.length+'</span></div>';
 out+=currentContractChecks.map(c=>'<div class="entry"><div class="entryhead"><div><h4>'+escapeHtml(c.title)+'</h4><p>'+(c.kind==='risk'?'Обнаружена формулировка, требующая правовой оценки':c.kind==='missing'?'Не удалось найти условие автоматическим поиском':c.kind==='context'?'Нужна дополнительная информация': 'Найден текстовый признак условия')+'</p>'+(c.excerpt?'<p><b>Фрагмент договора:</b> «'+escapeHtml(c.excerpt)+'»</p>':'')+'<p><b>Рекомендация:</b> '+escapeHtml(c.hint)+'</p><p><a href="'+LAW_LINKS[c.article]+'" target="_blank" rel="noopener noreferrer">Статья '+escapeHtml(c.article)+' ТК РФ · проверить редакцию ↗</a></p><p><button class="btn sm secondary" onclick="researchFinding('+c.article+')">🔎 Найти норму на официальном портале</button></p></div><span class="tag '+(c.kind==='risk'?'high':c.kind==='identified'?'low':'medium')+'">'+(c.kind==='risk'?'Риск':c.kind==='missing'?'Проверить':c.kind==='context'?'Уточнить':'Найдено')+'</span></div><div class="actions"><button class="btn sm secondary" onclick="addContractCheck('+c.id+')">+ В реестр аудита</button></div></div>').join('');
 document.getElementById('contractResults').innerHTML=out+'<p class="sub">Для окончательного вывода необходимо учитывать должность, дату договора, отраслевые нормы, локальные акты и приложения. Выбранные пункты можно передать в «Кадровый радар».</p>';

const _qaFacts=contractFacts;
contractFacts=function(s){
 const f=_qaFacts(s);
 // Previous implementation treated 14 days as 0.466 months, producing past deadlines.
 let m=/(?:испытательн[а-я]*\s+(?:срок|период)|срок\s+испытания|испытание)[^.\n]{0,65}?((?:\d+\s*(?:\(\s*[а-яё]+\s*\))?|один|одна|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|двенадцать))\s*(месяц[а-я]*|мес\.?|недел[а-я]*|дн(?:ей|я|и|ь)?|календарн[а-я]*\s+дн[а-я]*)/i.exec(s);
 if(m){let num=parseInt(m[1],10);if(!Number.isFinite(num))num=QA_NUM_WORDS[m[1].trim().toLowerCase()];const unit=m[2].toLowerCase();if(num>0){if(/месяц|мес/.test(unit)){f.probM=num;f.probDays=num*30;f.probUnit='month'}else{f.probM=null;f.probDays=/недел/.test(unit)?num*7:num;f.probUnit=/недел/.test(unit)?'week':'day'}}}

const _qaReview=localContractReview;

 // Reference to art.74 explicitly makes unilateral changes potentially legal; do not flag automatically.

const radarOriginalImport=importData;

 if(file.size>3_000_000){alert('Размер копии превышает 3 МБ');return}
 const reader=new FileReader();reader.onload=()=>{
  try{
   const x=JSON.parse(reader.result), safeId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,80}$/.test(v);
   if(!x||!Array.isArray(x.orgs)||!Array.isArray(x.tasks)||!Array.isArray(x.audits)||!x.orgs.includes(x.company)||x.tasks.length>10000||x.audits.length>1000)throw Error('Структура копии не подходит');
   if(!x.tasks.every(t=>safeId(t.id)&&typeof t.title==='string'&&radarDateValid(t.due)&&(!t.origin||(safeId(t.origin.auditId)&&safeId(t.origin.noteId)))))throw Error('Некорректные задачи или сроки');

   save();render();alert('Резервная копия восстановлена');
